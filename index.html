<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Boss Cafe Eleşkirt — kahve, çay, tatlı, nargile ve okey salonu. Güncel fiyatlar ve dijital menü."
    />
    <meta name="theme-color" content="#3E2A1F" />
    <meta name="color-scheme" content="light" />
    <link rel="preload" as="image" href="/photos/hero.jpg" fetchpriority="high" />
    <title>Boss Cafe — Kahve, Çay, Nargile & Okey Salonu | Eleşkirt</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6efe5;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgba(192, 133, 82, 0.16), transparent 55%),
          #f6efe5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #3e2a1f;
      }

      .boot-card {
        display: flex;
        max-width: 320px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .boot-logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }

      .boot-title {
        margin: 14px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .boot-status {
        margin: 6px 0 18px;
        color: rgba(62, 42, 31, 0.65);
        font-size: 13px;
        line-height: 1.5;
      }

      .boot-spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(62, 42, 31, 0.16);
        border-top-color: #c08552;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-retry {
        display: none;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        border-radius: 999px;
        background: #3e2a1f;
        padding: 10px 18px;
        color: #fdfbf7;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      #boot-screen.is-slow .boot-spinner {
        display: none;
      }

      #boot-screen.is-slow .boot-retry {
        display: inline-flex;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        #boot-screen {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-card">
        <img class="boot-logo" src="/logo.svg" alt="Boss Cafe" width="76" height="76" />
        <p class="boot-title">Boss Cafe</p>
        <p class="boot-status" id="boot-status">Menü hazırlanıyor…</p>
        <span class="boot-spinner" aria-hidden="true"></span>
        <a class="boot-retry" href="/">Sayfayı yenile</a>
      </div>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          z-index: 10000;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #f6efe5;
          color: #3e2a1f;
          font-family: system-ui, sans-serif;
          text-align: center;
        "
      >
        <p style="max-width: 360px; line-height: 1.6">
          Boss Cafe'yi görüntülemek için tarayıcınızda JavaScript'i açmanız
          gerekiyor.
        </p>
      </div>
    </noscript>

    <script>
      window.setTimeout(function () {
        var screen = document.getElementById("boot-screen");
        var status = document.getElementById("boot-status");
        if (screen) screen.classList.add("is-slow");
        if (status) {
          status.textContent =
            "Bağlantı yavaşladı. İnternetinizi kontrol edip sayfayı yenileyin.";
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
