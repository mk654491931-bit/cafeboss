<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" role="img" aria-label="Boss Cafe">
  <defs>
    <linearGradient id="bcMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4632" />
      <stop offset="1" stop-color="#2A1C13" />
    </linearGradient>
  </defs>

  <g fill="url(#bcMark)">
    <!-- crown -->
    <path d="M22 44 L27 20 L38 33 L50 10 L62 33 L73 20 L78 44 Z" />
    <!-- cup bowl -->
    <path d="M30 58 H70 C70 74 62 84 50 84 C38 84 30 74 30 58 Z" />
    <!-- saucer -->
    <ellipse cx="50" cy="88" rx="30" ry="4.5" />
  </g>

  <!-- handle -->
  <path
    d="M70 62 c12 -2 14 14 2 18"
    fill="none"
    stroke="url(#bcMark)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- steam -->
  <g fill="none" stroke="#A66E3F" stroke-width="4" stroke-linecap="round">
    <path d="M43 55 c-5 -6 5 -9 0 -16" />
    <path d="M57 55 c-5 -6 5 -9 0 -16" />
  </g>

  <!-- wordmark -->
  <text
    x="112"
    y="54"
    font-family="Fraunces, Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="700"
    letter-spacing="2"
    fill="#2A1C13"
  >
    BOSS
  </text>
  <text
    x="114"
    y="82"
    font-family="Inter, Arial, 'Helvetica Neue', sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="8"
    fill="#8A5A33"
  >
    — CAFE —
  </text>
</svg>
